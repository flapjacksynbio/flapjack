# Reverse proxy for a production Flapjack deployment.
#
# The API is a single ASGI server (gunicorn with uvicorn workers) that serves
# both HTTP and websockets, so everything proxies to one upstream. The 2020-era
# upstream config split HTTP to gunicorn/WSGI and websockets to a separate
# daphne process; that is not needed here and would drop websocket support from
# the API container.

upstream flapjack_api {
    server api:8000;
}

upstream flapjack_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;   # assay workbooks are uploaded whole

    # Websockets: plot, analysis, registry upload and measurements.
    location /ws/ {
        proxy_pass         http://flapjack_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;

        # Analysis and upload runs are long; do not cut them off mid-stream.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass         http://flapjack_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://flapjack_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }
}
